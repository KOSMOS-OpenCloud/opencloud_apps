# =============================================================
#  Aktenzeichen -> Fachbereich   (nur Posteingangs-App)
# =============================================================
#  Quelle:  ausgelesene Volume-Baeume Brandis
#  NICHT aus der VwV abgeleitet -- der reale Baum weicht ab
#  (Beispiel: 53.10 ist hier Gebaeudemanagement, in der VwV
#   waere es Elektrizitaetsversorgung).
#
#  Aufloesung: laengstes passendes Praefix gewinnt
#              6-Steller  >  4-Steller  >  2-Steller  >  auffang
#
#  Bereiche duerfen als Spanne "21-42" notiert werden;
#  der Loader expandiert sie zu 21,22,...,42.
# =============================================================

auffang: interne_services


# -------------------------------------------------------------
#  INTERNE SERVICES
# -------------------------------------------------------------
interne_services:
