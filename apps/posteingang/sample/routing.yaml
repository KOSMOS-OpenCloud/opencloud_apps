  bereiche:
    "11": Innere Verwaltung
    "61": Allgemeine Finanzwirtschaft        # ? Kaemmerei
    "81": Lohnverrechnung                    # ? kein Produktrahmen-Code

  gruppen:
    "12.11": Statistik und Wahlen            # ? aus 12 herausgeloest


